<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="'Nunito', 'Quicksand', 'Segoe UI', system-ui, sans-serif">
  <!-- OPCIÓN B: hélice que se convierte en curva de estabilidad -->

  <!-- Círculo turquesa (mismo espíritu que logo GEDEFO) -->
  <circle cx="110" cy="110" r="95" fill="#1AA5B0"/>

  <!-- Hélice en la mitad superior: dos hebras cruzándose -->
  <!-- Hebra magenta -->
  <path d="M 60 40
           C 90 55, 130 55, 160 40
           C 130 70, 90 70, 60 100"
        stroke="#D6418F" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Hebra lima -->
  <path d="M 160 40
           C 130 55, 90 55, 60 40
           C 90 70, 130 70, 160 100"
        stroke="#C5D634" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Pares de bases (transición: son a la vez escalones de ADN y puntos de datos) -->
  <circle cx="80" cy="48" r="4.5" fill="#F5D042"/>
  <circle cx="140" cy="48" r="4.5" fill="#F5D042"/>
  <circle cx="80" cy="82" r="4.5" fill="#F5D042"/>
  <circle cx="140" cy="82" r="4.5" fill="#F5D042"/>

  <!-- Transición: las hebras se enderezan -->
  <!-- La hélice baja → línea de estabilidad decreciente -->
  <path d="M 60 100
           C 75 110, 90 118, 110 130
           C 130 140, 150 150, 170 170"
        stroke="#D6418F" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 160 100
           C 150 108, 140 115, 130 122"
        stroke="#C5D634" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Puntos de datos sobre la curva de estabilidad -->
  <circle cx="75" cy="112" r="5" fill="#ffffff" stroke="#1AA5B0" stroke-width="2.5"/>
  <circle cx="110" cy="130" r="5" fill="#ffffff" stroke="#1AA5B0" stroke-width="2.5"/>
  <circle cx="145" cy="150" r="5" fill="#ffffff" stroke="#1AA5B0" stroke-width="2.5"/>
  <circle cx="170" cy="170" r="5" fill="#ffffff" stroke="#1AA5B0" stroke-width="2.5"/>

  <!-- Wordmark -->
  <text x="240" y="118" font-size="68" font-weight="700" fill="#1AA5B0" letter-spacing="-1">gedefo</text>
  <text x="475" y="118" font-size="68" font-weight="700" fill="#D6418F" letter-spacing="-1">-chart</text>

  <!-- Subtítulo -->
  <text x="242" y="155" font-size="18" font-weight="600" fill="#6D6E71" letter-spacing="0.5">Grupo de Farmacia Oncológica de la sefh</text>
</svg>
